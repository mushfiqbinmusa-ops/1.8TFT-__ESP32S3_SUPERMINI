; ============================================================================
;  ESP32-S3 SuperMini + 1.8" ST7735 TFT photo frame
; ============================================================================
;
;  Build with PlatformIO, not the Arduino IDE. arduino-builder on this machine
;  panics during include discovery (index out of range) before it ever reaches
;  the compiler; PlatformIO has its own builder and is unaffected.
;
;  Usage:
;      ~/pio-venv/bin/pio run -e smoke                 # build the wiring test
;      ~/pio-venv/bin/pio run -e smoke -t upload       # build + flash it
;      ~/pio-venv/bin/pio run -e supermini             # build the firmware
;      ~/pio-venv/bin/pio run -e supermini -t upload   # build + flash it
;      ~/pio-venv/bin/pio device monitor               # serial monitor @ 115200
;
;  Board definition: boards/esp32-s3-supermini.json
;  4 MB flash, 2 MB QSPI PSRAM, native USB CDC.
; ============================================================================

[platformio]
boards_dir = boards
default_envs = supermini

; ----------------------------------------------------------------------------
;  Gate 1 -- wiring test. Display only: no Wi-Fi, no server, no flash writes.
; ----------------------------------------------------------------------------
[env:smoke]
platform = espressif32
board = esp32-s3-supermini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<smoke.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -I esp32_s3_photoframe
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6

; ----------------------------------------------------------------------------
;  The firmware. Pulls a PNG from esp32-photoframe-server and caches it in
;  LittleFS, so the frame keeps showing the last photo when the server is down.
; ----------------------------------------------------------------------------
[env:supermini]
platform = espressif32
board = esp32-s3-supermini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<smoke.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -I esp32_s3_photoframe
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6
    ; The registry owner is "bitbank2", not "bitbanksoftware" -- the latter does
    ; not exist and makes dependency resolution fail outright.
    bitbank2/PNGdec@^1.1.6
